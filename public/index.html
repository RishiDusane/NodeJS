<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js URL Responses</title>
</head>
<body>
    <h1>Node.js Custom Responses</h1>

```
<button onclick="getResponse('/home')">Home</button>
<button onclick="getResponse('/about')">About</button>
<button onclick="getResponse('/node')">Node</button>
<button onclick="getResponse('/pizza')">Pizza</button>

<div id="response"></div>

<script>
    async function getResponse(url) {
        try {
            const res = await fetch(url);
            const message = await res.text();

            const element = document.createElement('h2');
            element.textContent = message;

            document.getElementById('response').appendChild(element);
        } catch (error) {
            console.log(error);
        }
    }
</script>
```

</body>
</html>
